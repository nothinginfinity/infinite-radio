name: V0.3 Real Fal Acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BASE_URL: https://infinite-radio.jaredtechfit.workers.dev

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Baseline check
        run: npm run check

      - name: Build temporary guarded acceptance route
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(node -e 'console.log(require("crypto").randomBytes(32).toString("hex"))')"
          CHANNEL="v03-real-fal-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          CREATOR="operator:${CHANNEL}"
          echo "::add-mask::$TOKEN"
          echo "TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "CHANNEL=$CHANNEL" >> "$GITHUB_ENV"
          echo "CREATOR=$CREATOR" >> "$GITHUB_ENV"

          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path("src/index.js")
          source = path.read_text()
          token = os.environ["TOKEN"]
          channel = os.environ["CHANNEL"]
          creator = os.environ["CREATOR"]

          helper = f'''
async function runV03FalAcceptance(env) {{
  if (!env.FAL_API_KEY) {{
    return json({{ ok: false, error: "operator_provider_key_unavailable" }}, {{ status: 503 }});
  }}

  const channelId = {channel!r};
  const creatorId = {creator!r};

  async function channelCall(tail, {{ method = "GET", body, providerKey }} = {{}}) {{
    const headers = new Headers({{ "x-creator-id": creatorId }});
    if (providerKey) headers.set("x-provider-key", providerKey);
    if (body !== undefined) headers.set("content-type", "application/json");
    const request = new Request(`https://acceptance.internal/api/channels/${{channelId}}${{tail}}`, {{
      method,
      headers,
      body: body === undefined ? undefined : JSON.stringify(body),
    }});
    const response = await proxyChannelRequest(request, env, {{ channelId, tail }});
    const data = await response.json();
    return {{ response, data }};
  }}

  const init = await channelCall("/init", {{
    method: "POST",
    body: {{
      creatorId,
      policy: {{
        bufferTargetSeconds: 30,
        generationCapPerHour: 1,
      }},
    }},
  }});
  if (!init.response.ok) {{
    return json({{ ok: false, step: "init", detail: init.data }}, {{ status: init.response.status }});
  }}

  const provider = await channelCall("/provider", {{
    method: "POST",
    providerKey: env.FAL_API_KEY,
    body: {{
      provider: "fal-cassetteai",
      generationCapPerHour: 1,
      generationCapPerDay: 1,
      bufferTargetSeconds: 30,
    }},
  }});
  if (!provider.response.ok) {{
    return json({{ ok: false, step: "provider", detail: provider.data }}, {{ status: provider.response.status }});
  }}

  const prompt = await channelCall("/prompts", {{
    method: "POST",
    body: {{
      id: `v03-real-fal-${{channelId}}`,
      idempotencyKey: `v03-real-fal-${{channelId}}`,
      userId: "operator:v03-acceptance",
      text: "Original instrumental midnight synthwave radio track with warm analog bass, glassy arpeggios, atmospheric pads, and a dramatic futuristic transition. No imitation of any existing artist.",
      votes: 0,
    }},
  }});
  if (!prompt.response.ok) {{
    return json({{ ok: false, step: "prompt", detail: prompt.data }}, {{ status: prompt.response.status }});
  }}

  const generation = await channelCall("/generation/next", {{
    method: "POST",
    providerKey: env.FAL_API_KEY,
    body: {{ durationSeconds: 30 }},
  }});
  if (!generation.response.ok) {{
    return json({{ ok: false, step: "generation", detail: generation.data }}, {{ status: generation.response.status }});
  }}

  return json({{
    ok: true,
    channel_id: channelId,
    creator_id: creatorId,
    credential_ref: provider.data?.policy?.credentialRef ?? null,
    generation: generation.data,
  }}, {{ status: 201 }});
}}
'''

          marker = "\nexport default {\n"
          if marker not in source:
              raise SystemExit("export_default_marker_missing")
          source = source.replace(marker, "\n" + helper + marker, 1)

          route_marker = '    const url = new URL(request.url);\n\n    if (request.method === "GET" && url.pathname === "/health") {'
          route_replacement = f'''    const url = new URL(request.url);

    if (request.method === "POST" && url.pathname === "/__v03_fal_acceptance_{token}") {{
      return runV03FalAcceptance(env);
    }}

    if (request.method === "GET" && url.pathname === "/health") {{'''
          if route_marker not in source:
              raise SystemExit("fetch_route_marker_missing")
          source = source.replace(route_marker, route_replacement, 1)
          path.write_text(source)
          PY

          node --check src/index.js

      - name: Deploy temporary acceptance harness
        id: temp_deploy
        continue-on-error: true
        run: npm run deploy

      - name: Execute and verify real Fal generation
        id: acceptance
        if: steps.temp_deploy.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          HTTP="$(curl -sS -o acceptance.json -w '%{http_code}' \
            -X POST "$BASE_URL/__v03_fal_acceptance_$TOKEN")"
          python3 -m json.tool acceptance.json
          test "$HTTP" = "201"

          python3 - <<'PY'
          import json, os
          data = json.load(open("acceptance.json"))
          assert data["ok"] is True
          assert data["channel_id"] == os.environ["CHANNEL"]
          assert data["creator_id"] == os.environ["CREATOR"]
          assert data["credential_ref"].startswith("fal-cassetteai:sha256:")
          generation = data["generation"]
          assert generation["ok"] is True
          track = generation["track"]
          receipt = generation["receipt"]
          assert track["channelId"] == os.environ["CHANNEL"]
          assert track["assetKey"].startswith(f'channels/{os.environ["CHANNEL"]}/generated/')
          assert track["contentType"] == "audio/wav"
          assert generation["state"]["generationJobs"][-1]["status"] == "ready"
          assert receipt["provider_request_id"]
          assert receipt["latency_ms"] >= 0
          assert receipt["cost_microusd"] == 10000
          assert receipt["provenance"]["provider"] == "fal-cassetteai"
          assert receipt["provenance"]["model"] == "CassetteAI/music-generator"
          with open(os.environ["GITHUB_ENV"], "a") as fh:
              fh.write(f'ASSET_KEY={track["assetKey"]}\n')
              fh.write(f'GENERATION_ID={generation["generation_id"]}\n')
              fh.write(f'RECEIPT_ID={receipt["receipt_id"]}\n')
          PY

          curl -sS "$BASE_URL/api/channels/$CHANNEL/state" \
            -H "x-creator-id: $CREATOR" > state.json
          python3 - <<'PY'
          import json, os
          data = json.load(open("state.json"))
          assert data["ok"] is True
          state = data["state"]
          assert state["channelId"] == os.environ["CHANNEL"]
          assert state["creatorId"] == os.environ["CREATOR"]
          assert state["generationJobs"][-1]["status"] == "ready"
          assert state["generationJobs"][-1]["receiptId"] == os.environ["RECEIPT_ID"]
          tracks = [state.get("currentTrack"), *state.get("readyQueue", [])]
          tracks = [t for t in tracks if t]
          assert tracks
          assert all(t["channelId"] == os.environ["CHANNEL"] for t in tracks)
          assert all(t["assetKey"].startswith(f'channels/{os.environ["CHANNEL"]}/') for t in tracks)
          PY

          FOREIGN_HTTP="$(curl -sS -o foreign.json -w '%{http_code}' \
            "$BASE_URL/api/channels/$CHANNEL/state" \
            -H "x-creator-id: creator-not-owner")"
          test "$FOREIGN_HTTP" = "400"
          python3 - <<'PY'
          import json
          data = json.load(open("foreign.json"))
          assert data["ok"] is False
          assert data["error"] == "channel_owner_required"
          PY

          npx wrangler r2 object get \
            "infinite-radio-assets/$ASSET_KEY" \
            --file acceptance.wav \
            --remote

          python3 - <<'PY'
          from pathlib import Path
          raw = Path("acceptance.wav").read_bytes()
          assert len(raw) > 44
          assert raw[:4] == b"RIFF"
          assert raw[8:12] == b"WAVE"
          print({"wav_bytes": len(raw), "riff": True, "wave": True})
          PY

          SQL="SELECT receipt_id, channel_id, generation_id, provider, model, provider_request_id, duration_seconds, latency_ms, cost_microusd, terms_uri, provenance_json, created_at FROM provider_receipts WHERE channel_id='$CHANNEL' ORDER BY created_at DESC LIMIT 1;"
          npx wrangler d1 execute infinite-radio-db \
            --remote \
            --command "$SQL" \
            --json > receipt.json

          python3 - <<'PY'
          import json, os
          payload = json.load(open("receipt.json"))
          blocks = payload if isinstance(payload, list) else [payload]
          rows = []
          for block in blocks:
              if isinstance(block, dict):
                  rows.extend(block.get("results") or [])
                  result = block.get("result")
                  if isinstance(result, list):
                      rows.extend(result)
                  elif isinstance(result, dict):
                      rows.extend(result.get("results") or [])
          assert rows, payload
          row = rows[0]
          assert row["receipt_id"] == os.environ["RECEIPT_ID"]
          assert row["channel_id"] == os.environ["CHANNEL"]
          assert row["generation_id"] == os.environ["GENERATION_ID"]
          assert row["provider"] == "fal-cassetteai"
          assert row["model"] == "CassetteAI/music-generator"
          assert row["provider_request_id"]
          assert int(row["duration_seconds"]) == 30
          assert int(row["latency_ms"]) >= 0
          assert int(row["cost_microusd"]) == 10000
          print(row)
          PY

      - name: Restore canonical V0.3 source
        id: restore
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- src/index.js
          npm run deploy

      - name: Verify temporary route is gone
        if: always() && steps.restore.outcome == 'success' && env.TOKEN != ''
        shell: bash
        run: |
          set -euo pipefail
          HTTP="$(curl -sS -o restored.json -w '%{http_code}' \
            -X POST "$BASE_URL/__v03_fal_acceptance_$TOKEN")"
          test "$HTTP" = "404"
          curl -sS "$BASE_URL/health" | python3 -m json.tool

      - name: Fail if acceptance did not succeed
        if: always()
        shell: bash
        run: |
          test "${{ steps.temp_deploy.outcome }}" = "success"
          test "${{ steps.acceptance.outcome }}" = "success"
          test "${{ steps.restore.outcome }}" = "success"
