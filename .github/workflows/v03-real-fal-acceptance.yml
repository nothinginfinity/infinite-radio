name: V0.3 Real Fal Acceptance

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BASE_URL: https://infinite-radio.jaredtechfit.workers.dev

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install
      - run: npm run check

      - name: Build temporary guarded route
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(node -e 'console.log(require("crypto").randomBytes(32).toString("hex"))')"
          CHANNEL="v03-real-fal-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          CREATOR="operator:${CHANNEL}"
          echo "::add-mask::$TOKEN"
          echo "TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "CHANNEL=$CHANNEL" >> "$GITHUB_ENV"
          echo "CREATOR=$CREATOR" >> "$GITHUB_ENV"
          node scripts/v03-real-fal-acceptance-patch.mjs
          node --check src/index.js

      - name: Deploy temporary acceptance harness
        id: temp_deploy
        continue-on-error: true
        run: npm run deploy

      - name: Execute real Fal generation and verify persisted evidence
        id: acceptance
        if: steps.temp_deploy.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          HTTP="$(curl -sS -o acceptance.json -w '%{http_code}' "$BASE_URL/__v03_fal_acceptance_$TOKEN")"
          python3 -m json.tool acceptance.json
          test "$HTTP" = "201"
          python3 - <<'PY'
          import json, os
          data = json.load(open("acceptance.json"))
          assert data["ok"] is True
          assert data["channel_id"] == os.environ["CHANNEL"]
          assert data["creator_id"] == os.environ["CREATOR"]
          assert data["credential_ref"].startswith("fal-cassetteai:sha256:")
          assert data["track"]["channelId"] == os.environ["CHANNEL"]
          assert data["track"]["assetKey"].startswith(f'channels/{os.environ["CHANNEL"]}/generated/')
          assert data["track"]["contentType"] == "audio/wav"
          receipt = data["receipt"]
          assert receipt["provider_request_id"]
          assert receipt["latency_ms"] >= 0
          assert receipt["cost_microusd"] == 10000
          assert receipt["provenance"]["provider"] == "fal-cassetteai"
          assert receipt["provenance"]["model"] == "CassetteAI/music-generator"
          proof = data["proof"]
          assert proof["state_ready"] is True
          assert proof["r2"]["riff"] is True
          assert proof["r2"]["wave"] is True
          assert proof["r2"]["wav_bytes"] > 44
          assert proof["r2"]["asset_key"] == data["track"]["assetKey"]
          assert proof["d1_receipt"]["receipt_id"] == receipt["receipt_id"]
          assert proof["d1_receipt"]["channel_id"] == os.environ["CHANNEL"]
          assert proof["d1_receipt"]["generation_id"] == data["generation_id"]
          assert proof["d1_receipt"]["provider_request_id"] == receipt["provider_request_id"]
          assert int(proof["d1_receipt"]["duration_seconds"]) == 30
          assert int(proof["d1_receipt"]["cost_microusd"]) == 10000
          assert proof["isolation"]["foreign_creator_rejected"] is True
          print({
              "generation_id": data["generation_id"],
              "asset_key": data["track"]["assetKey"],
              "provider_request_id": receipt["provider_request_id"],
              "latency_ms": receipt["latency_ms"],
              "cost_microusd": receipt["cost_microusd"],
              "wav_bytes": proof["r2"]["wav_bytes"],
          })
          PY

      - name: Restore canonical V0.3 source
        id: restore
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- src/index.js
          npm run deploy

      - name: Verify temporary route is gone
        if: always() && steps.restore.outcome == 'success' && env.TOKEN != ''
        shell: bash
        run: |
          set -euo pipefail
          HTTP="$(curl -sS -o restored.json -w '%{http_code}' "$BASE_URL/__v03_fal_acceptance_$TOKEN")"
          test "$HTTP" = "404"
          curl -sS "$BASE_URL/health" | python3 -m json.tool

      - name: Fail if acceptance did not succeed
        if: always()
        shell: bash
        run: |
          test "${{ steps.temp_deploy.outcome }}" = "success"
          test "${{ steps.acceptance.outcome }}" = "success"
          test "${{ steps.restore.outcome }}" = "success"
